    <style>

        .titolo{
            background-color: #005c95;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        input[type="text"] {
            display: block; 
            margin-top: 5px; 
            border: 1px solid #000;  
            border-radius: 6px;      
            padding: 8px 12px;       
            outline: none;
            font-family: "Lexend", sans-serif;
            font-size: 13.3333px;
            box-sizing: border-box;
            width: 260px;
        }

        input[type="time"] {
            display: block; 
            margin-top: 5px; 
            border: 1px solid #000;  
            border-radius: 6px;      
            padding: 6px 12px;       
            outline: none;
            font-family: "Lexend", sans-serif;
            font-size: 13.3333px;
            box-sizing: border-box;
        }

        label {
            font-size: 13.3333px;
            line-height: normal;
        }

        .campo-con-orario {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            flex-wrap: wrap;
        }

        .campo-con-orario > div {
            display: flex;
            flex-direction: column;
        }

        h1{
            font-size: 15px;
        }

        #risultato-arrivo {
            font-size: 15px;
            color: black;
            margin-top: 20px;
            min-height: 28px;
            line-height: 1.5;
        }

        hr{
            margin-top: -5px;
        }

        .headerlogo{
            width: 180px;
        }

        body{
            margin: 0px;
            font-family: "Lexend", sans-serif;
            font-weight: 400;
            font-style: normal;
        }

        .blocco{
            margin: 10px;
        }

        .blocco form{
            margin-top: 20px;
        }

        .titolo-tratta {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icona-scambio {
            cursor: pointer;
            width: 20px;
            height: 20px;
            user-select: none;
            transition: transform 0.3s ease;
        }

        .icona-scambio.ruota {
            transform: rotate(180deg);
        }

        #btn-visualizza {
            background-color: #005c95;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 9px 18px;
            font-family: "Lexend", sans-serif;
            font-size: 13.3333px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 25px;
        }

        #btn-visualizza:hover {
            background-color: #004a78;
        }
    </style>
</head>

        function popolaFermate() {
            const dati = datiCorrenti();
            const fermate = Object.keys(dati);

            listaPartenza.innerHTML = '';
            listaArrivo.innerHTML = '';

            fermate.forEach(f => {
                const opt1 = document.createElement('option');
                opt1.value = f;
                listaPartenza.appendChild(opt1);

                const opt2 = document.createElement('option');
                opt2.value = f;
                listaArrivo.appendChild(opt2);
            });

            inputPartenza.value = '';
            inputArrivo.value = '';
            inputOrario.value = '';
            risultato.textContent = '';

            const parti = orario.split(':');
            return parseInt(parti[0], 10) * 60 + parseInt(parti[1], 10);

        function trovaOrarioPiuVicino(orari, orarioUtente) {
            const minutiUtente = orarioInMinuti(orarioUtente);
            let migliore = null;
            let differenzaMinima = Infinity;

            orari.forEach(o => {
                if (!o || o === '--') return;
                const pulito = o.replace('*', '').trim();
                const minuti = orarioInMinuti(pulito);
                const diff = Math.abs(minuti - minutiUtente);

                if (diff < differenzaMinima) {
                    differenzaMinima = diff;
                    migliore = pulito;
                }
            });

            return migliore;
        }

        function visualizza() {
            const dati = datiCorrenti();
            const partenza = inputPartenza.value.trim().toUpperCase();
            const arrivo = inputArrivo.value.trim().toUpperCase();
            const orario = inputOrario.value;

            risultato.textContent = '';

            if (!partenza || !arrivo || !orario) {
                risultato.textContent = 'Compila tutti i campi.';
                return;
            }

            const chiavePartenza = Object.keys(dati).find(k => k.toUpperCase() === partenza);
            const chiaveArrivo = Object.keys(dati).find(k => k.toUpperCase() === arrivo);

            if (!chiavePartenza || !chiaveArrivo) {
                risultato.textContent = 'Fermata non trovata.';
                return;
            }

            const orariPartenza = dati[chiavePartenza];
            const orariArrivo = dati[chiaveArrivo];

            const orarioPiuVicino = trovaOrarioPiuVicino(orariPartenza, orario);

            if (!orarioPiuVicino) {
                risultato.textContent = 'Nessuna corsa disponibile per questa partenza.';
                return;
            }

            const indice = orariPartenza.findIndex(o => {
                if (!o || o === '--') return false;
                return o.replace('*', '').trim() === orarioPiuVicino;
            });

            if (indice === -1) {
                risultato.textContent = 'Nessuna corsa disponibile per questa combinazione.';
                return;
            }

            const orarioArrivo = orariArrivo[indice];

            if (!orarioArrivo || orarioArrivo === '--') {
                risultato.textContent = 'Nessuna corsa disponibile per questa combinazione.';
                return;
            }

            const orarioArrivoPulito = orarioArrivo.replace('*', '').trim();

            risultato.innerHTML = `Partenza: ${chiavePartenza} - ${orarioPiuVicino}<br>Arrivo: ${chiaveArrivo} - ${orarioArrivoPulito}`;
        }

        icona.addEventListener('click', () => {
            invertito = !invertito;
            icona.classList.toggle('ruota', invertito);
            titolo.textContent = invertito
                ? 'Orari Preite | Cosenza-Praia'
                : 'Orari Preite | Praia-Cosenza';
            popolaFermate();
        });

        btnVisualizza.addEventListener('click', visualizza);

        document.querySelector('form').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                visualizza();
            }
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then((reg) => console.log('Service Worker registrato:', reg.scope))
                    .catch((err) => console.error('Errore Service Worker:', err));
            });
        }

        popolaFermate();
    </script>
</body>
</html>
